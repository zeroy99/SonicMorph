[package]
name = "converter_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "AudioConverter"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"
hound = "3.5"
symphonia = { version = "0.5.4", features = ["mp3", "pcm", "vorbis", "wav", "isomp4", "flac"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
rusty_mp3 = "1.0.1"
rusty_vorbis = "0.1.1"
ogg = "0.9.2"
